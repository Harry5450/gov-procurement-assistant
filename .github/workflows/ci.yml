name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/data/pcc-template-index.json'
      - 'src/data/pcc-template-assets.json'
      - 'src/data/pcc-template-text.json'
      - 'src/data/pcc-template-text/**'
      - 'official-templates/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/pcc-watcher.mjs
      - run: node --check scripts/pcc-assets.mjs
      - run: node --check scripts/pcc-text.mjs
      - run: npm run pcc:text -- --dry-run
      - run: npm run template:smoke
      - run: npm run build
