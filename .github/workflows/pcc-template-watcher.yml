name: PCC Template Watcher

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pcc-watcher.mjs'
      - 'scripts/pcc-assets.mjs'
      - '.github/workflows/pcc-template-watcher.yml'
      - 'package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch PCC official template index
        run: npm run pcc:watch

      - name: Download and verify core official template files
        run: npm run pcc:assets

      - name: Detect official template changes
        id: diff
        shell: bash
        run: |
          CHANGES="$(git status --porcelain -- src/data/pcc-template-index.json src/data/pcc-template-assets.json official-templates)"
          if [ -z "$CHANGES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No PCC template changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PCC template assets or index changed:"
            echo "$CHANGES"
          fi

      - name: Publish candidate branch
        if: steps.diff.outputs.changed == 'true'
        id: publish
        shell: bash
        run: |
          BRANCH="automation/pcc-template-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/pcc-template-index.json src/data/pcc-template-assets.json official-templates
          git commit -m "chore: refresh PCC official template assets"
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or refresh candidate PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          EXISTING="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          BODY=$(cat <<'EOF'
          工程會公開範本偵測到版本或檔案變更。

          本 PR 可能包含：
          - 官方索引快照更新
          - DOCX / ODT / PDF 官方檔案的新版本封存
          - 每個檔案的 SHA-256、大小、原始下載 URL 與官方檔名

          安全與版本規則：
          1. 官方檔案以 `official-templates/<template>/<ROC-version>/` 保存，歷史版本不覆寫。
          2. 同一版本若官方內容 SHA-256 發生漂移，Watcher 會直接失敗，要求人工調查。
          3. 此 PR 仍是 candidate，不會自動更新 active Template Registry。
          4. Watcher 只讀工程會公開網站，不接觸任何採購案件、IndexedDB 或機敏內容。

          請人工確認新版本與修正內容，再決定是否合併及升版 active Registry。
          EOF
          )

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: PCC official template assets update" \
              --body "$BODY"
          else
            gh pr edit "$EXISTING" --body "$BODY"
            echo "Updated existing candidate PR #$EXISTING"
          fi
