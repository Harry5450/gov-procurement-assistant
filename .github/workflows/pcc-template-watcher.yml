name: PCC Template Watcher

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch PCC official template index
        run: npm run pcc:watch

      - name: Detect official index changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- src/data/pcc-template-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No PCC template index changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PCC template index changed."
            git diff -- src/data/pcc-template-index.json
          fi

      - name: Publish candidate branch
        if: steps.diff.outputs.changed == 'true'
        id: publish
        shell: bash
        run: |
          BRANCH="automation/pcc-template-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/pcc-template-index.json
          git commit -m "chore: refresh PCC template index"
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or refresh candidate PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          EXISTING="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          BODY=$(cat <<'EOF'
          工程會「招標相關文件及表格」官方索引偵測到變更。

          這個 PR 只更新公開的官方範本索引快照，不會自動覆寫目前 active 範本，也不會接觸任何採購案件資料。

          請人工確認：
          1. 文件名稱與最近更新日期是否合理。
          2. 是否需要下載新版官方檔案並做 SHA-256 / 內容 Diff。
          3. 確認後再決定是否更新 active Template Registry。

          安全原則：candidate -> 人工審查 -> active，禁止自動升版。
          EOF
          )

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: PCC template index update" \
              --body "$BODY"
          else
            gh pr edit "$EXISTING" --body "$BODY"
            echo "Updated existing candidate PR #$EXISTING"
          fi
