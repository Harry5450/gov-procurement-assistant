name: PCC Template Watcher

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/pcc-watcher.mjs'
      - 'scripts/pcc-assets.mjs'
      - 'scripts/pcc-text.mjs'
      - 'scripts/template-anchor-audit.mjs'
      - '.github/workflows/pcc-template-watcher.yml'
      - 'package.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Fetch PCC official template index
        run: npm run pcc:watch

      - name: Download and verify core official template files
        run: npm run pcc:assets

      - name: Normalize official ODT content for human-readable review
        run: npm run pcc:text

      - name: Detect official template changes
        id: diff
        shell: bash
        run: |
          CHANGES="$(git status --porcelain -- src/data/pcc-template-index.json src/data/pcc-template-assets.json src/data/pcc-template-text.json src/data/pcc-template-text official-templates)"
          if [ -z "$CHANGES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No PCC template changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PCC template assets, normalized text, or index changed:"
            echo "$CHANGES"
          fi

      - name: Install dependencies for candidate validation
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Validate candidate snapshot and application
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          node --check scripts/pcc-watcher.mjs
          node --check scripts/pcc-assets.mjs
          node --check scripts/pcc-text.mjs
          node --check scripts/template-anchor-audit.mjs
          npm run pcc:text -- --dry-run
          npm run template:anchors
          npm run template:smoke
          npm run build

      - name: Publish candidate branch
        if: steps.diff.outputs.changed == 'true'
        id: publish
        shell: bash
        run: |
          BRANCH="automation/pcc-template-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data/pcc-template-index.json src/data/pcc-template-assets.json src/data/pcc-template-text.json src/data/pcc-template-text official-templates
          git commit -m "chore: refresh PCC official template assets"
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or refresh candidate PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          EXISTING="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          BODY=$(cat <<'EOF'
          工程會公開範本偵測到版本或檔案變更。

          本 PR 可能包含：
          - 官方索引快照更新
          - Word（DOCX 或 DOC）/ ODT / PDF 官方檔案的新版本封存
          - 每個檔案的 SHA-256、大小、原始下載 URL 與官方檔名
          - 由 ODT deterministic extraction 產生的 normalized text
          - `latest/*.txt` 的 Git diff，可直接閱讀新版與前一版的文字差異

          自動驗證已在 PCC Template Watcher 內完成：
          - watcher / asset / text / anchor audit script syntax check
          - normalized text dry-run
          - writer anchor uniqueness + checkbox audit
          - template writer smoke test
          - production build

          安全與版本規則：
          1. 官方檔案以 `official-templates/<template>/<ROC-version>/` 保存，歷史版本不覆寫。
          2. 同一版本若官方內容 SHA-256 發生漂移，Watcher 會直接失敗，要求人工調查。
          3. versioned normalized text 同樣 immutable；`latest/*.txt` 僅作為人工 review diff。
          4. Writer 使用的 Anchor 必須在對應官方 XML 唯一解析；缺失或歧義時 candidate validation 直接失敗。
          5. 此 PR 仍是 candidate，不會自動更新 active Template Registry。
          6. Watcher 只讀工程會公開網站，不接觸任何採購案件、IndexedDB 或機敏內容。
          7. 純 generated-data candidate PR 不重複觸發一般 CI；程式碼／workflow PR 仍會跑完整 CI。

          請人工確認新版本與文字差異，再決定是否合併及升版 active Registry。
          EOF
          )

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: PCC official template assets update" \
              --body "$BODY"
          else
            gh pr edit "$EXISTING" --body "$BODY"
            echo "Updated existing candidate PR #$EXISTING"
          fi
