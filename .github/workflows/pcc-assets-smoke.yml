name: PCC Assets Smoke

on:
  pull_request:
    branches: [main]

jobs:
  live-pcc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh live PCC index
        run: npm run pcc:watch
      - name: Verify live PCC core assets without writing
        run: npm run pcc:assets -- --dry-run
